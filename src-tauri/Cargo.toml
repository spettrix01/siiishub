[package]
name = "siiishub-desktop"
version = "1.3.5"
edition = "2021"
description = "siiishub: self-hosted streaming hub with embedded mpv"
authors = ["siiis"]
license = "GPL-3.0-or-later"
default-run = "SIIISHUB"

[lib]
name = "siiishub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The Tauri bundler packs a binary only when its required features are listed
# explicitly, so tauri.conf.json lists `app` in build.features.
[[bin]]
name = "SIIISHUB"
path = "src/main.rs"
required-features = ["app"]

# The browser interface served over HTTP, for Docker (docs/WEB.md):
#   cargo build --release --no-default-features --features server
# Not in src/bin: the Tauri bundler would put every file there in the app
# packages.
[[bin]]
name = "siiishub-server"
path = "src/server_main.rs"
required-features = ["server"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

# Remote control: embedded HTTP + WebSocket server for phone UI. The web
# server (feature `server`) is built on it too.
axum = { version = "0.8", features = ["ws"] }
# siiishub-server: static files, and media files served with byte ranges.
tower-http = { version = "0.6", features = ["fs"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
# siiishub-server: account passwords, kept as Argon2 hashes.
argon2 = { version = "0.5", optional = true, default-features = false, features = ["alloc", "password-hash"] }
local-ip-address = "0.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Async / runtime
tokio = { version = "1", features = ["full"] }
# `io`: the web server streams ffmpeg's output as an HTTP body.
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"

# Serialization
# `rc`: librqbit deserializes `Arc<str>` without asking for it; in the app
# Tauri's dependencies turn it on, the web server has to.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }

# Errors / utility
anyhow = "1"
thiserror = "1"
once_cell = "1"
parking_lot = "0.12"
regex = "1"
url = "2"
percent-encoding = "2"
urlencoding = "2"
sha2 = "0.10"
sha1 = "0.10"
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ico = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Torrent client (pure-Rust). `rust-tls` keeps OpenSSL out of the graph, which
# matters for the Android cross-build.
# `http-api` enables the in-process HTTP server with a streaming endpoint
# (GET /torrents/{id_or_infohash}/stream/{file_idx}) that mpv consumes.
# `tracing-subscriber-utils` is required because the `http-api` log handler
# unconditionally calls `Api::api_log_lines_stream`, which is gated on it.
librqbit = { version = "8", default-features = false, features = ["rust-tls", "http-api", "http-api-client", "tracing-subscriber-utils"] }

# libmpv binding for the desktop builds.
# Windows: uses libmpv-2.dll at runtime and links an import library generated
#   from it (scripts/windows-build.ps1, see docs/BUILDING.md).
# Linux: links the system libmpv (`libmpv-dev` at build time, `libmpv2` at
#   runtime); the video is drawn through the OpenGL render API, see
#   src/render_linux.rs.
# Android embeds libmpv through the Kotlin plugin instead (see below).
[target.'cfg(not(target_os = "android"))'.dependencies]
libmpv2 = { version = "4", optional = true }
libmpv2-sys = { version = "4", optional = true }

# Win32 / DirectX bindings for the mpv↔WebView2 compositor
[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux: GTK / WebKitGTK integration for the video pipeline (GtkGLArea under
# the transparent webview, src/render_linux.rs) and desktop integration
# (screensaver inhibit over D-Bus, folder icons via GIO). The versions must
# match the ones tauri/wry are built against (gtk 0.18, webkit2gtk 2.0).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
webkit2gtk = { version = "2.0", optional = true }
libloading = { version = "0.8", optional = true }
libc = { version = "0.2", optional = true }

# Android: embedded libmpv through the Kotlin plugin, logs to logcat.
[target.'cfg(target_os = "android")'.dependencies]
siiishub-android-player = { path = "plugins/android-player", optional = true }
tracing-android = "0.2"

[features]
# Default: the app (Tauri) with its custom protocol and the embedded libmpv
# player. `real-mpv` only pulls libmpv on desktop; Android always plays
# through the Kotlin plugin. To work on the desktop UI before libmpv is set up:
#   cargo check --no-default-features --features custom-protocol,stub-mpv
default = ["app", "custom-protocol", "real-mpv"]
# The desktop and Android app. Every app feature below turns it on.
app = [
    "dep:tauri",
    "dep:tauri-plugin-shell",
    "dep:tauri-plugin-dialog",
    "dep:tauri-build",
    "dep:gtk",
    "dep:webkit2gtk",
    "dep:libloading",
    "dep:libc",
    "dep:siiishub-android-player",
]
custom-protocol = ["app", "tauri/custom-protocol"]
real-mpv = ["app", "dep:libmpv2", "dep:libmpv2-sys"]
stub-mpv = ["app"]
# WebView remote debugging in release builds (DevTools, chrome://inspect,
# `adb forward` on Android). Debug builds always have it; builds meant for
# users must not.
devtools = ["app", "tauri/devtools"]
# The Android TV APK: the desktop interface driven by the TV's remote, and the
# phone remote's server, as on a PC. scripts/android-build.sh builds it.
tv = ["app"]
# siiishub-server: the interface in the browser, without Tauri or libmpv.
server = ["dep:tower-http", "dep:tower", "dep:argon2"]

# librqbit's SHA-1 wrapper links OpenSSL or aws-lc; the local copy hashes in
# pure Rust so the Android cross-build needs no native crypto toolchain.
[patch.crates-io]
librqbit-sha1-wrapper = { path = "vendor/librqbit-sha1-wrapper" }

[profile.release]
# panic = "abort" disabled while diagnosing — we want backtraces.
codegen-units = 1
lto = true
opt-level = "s"
strip = false
