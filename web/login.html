<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#131316" />
<title>SIIISHUB</title>
<script>
  // The theme last used here (web/web.js keeps a copy), before the first paint.
  (function () {
    try {
      var root = document.documentElement;
      if (localStorage.getItem('siiishub-web-theme') === 'light') root.setAttribute('data-theme', 'light');
      var accent = localStorage.getItem('siiishub-web-accent');
      if (accent === 'purple' || accent === 'teal') root.setAttribute('data-accent', accent);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/web/login.css" />
<link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png" />
<link rel="icon" type="image/png" sizes="64x64" href="/img/icon-64.png" />
<link rel="apple-touch-icon" href="/img/icon-256.png" />
</head>
<body class="login-page">
<main class="login-card">
  <h1 class="login-brand">SIIIS<em>HUB</em></h1>

  <!-- The first start: the administrator's account, from the home network. -->
  <form class="login-form" id="setupForm" hidden>
    <h2 class="login-title" data-i18n="web.login.setupTitle">Create the administrator account</h2>
    <p class="login-note" data-i18n="web.login.setupHint">It manages this server and makes the other accounts.</p>
    <label class="login-label" for="setupUser" data-i18n="web.login.username">Username</label>
    <input class="login-input" id="setupUser" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required />
    <label class="login-label" for="setupPassword" data-i18n="web.login.password">Password</label>
    <input class="login-input" id="setupPassword" name="password" type="password" autocomplete="new-password" required />
    <p class="login-error" id="setupError" role="alert" hidden></p>
    <button class="login-submit" type="submit" data-i18n="web.login.setupSubmit">Create and sign in</button>
  </form>

  <form class="login-form" id="loginForm" hidden>
    <label class="login-label" for="loginUser" data-i18n="web.login.username">Username</label>
    <input class="login-input" id="loginUser" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" />
    <label class="login-label" for="loginPassword" data-i18n="web.login.password">Password</label>
    <input class="login-input" id="loginPassword" name="password" type="password" autocomplete="current-password" required />
    <p class="login-error" id="loginError" role="alert" hidden></p>
    <button class="login-submit" id="loginSubmit" type="submit" data-i18n="web.login.submit">Sign in</button>
  </form>

  <p class="login-note" id="setupAtHome" data-i18n="web.login.setupAtHome" hidden>Create the first account from a device on the server's home network.</p>

  <div class="login-guest" id="guestBox" hidden>
    <span class="login-or" data-i18n="web.login.or">or</span>
    <button class="login-guest-btn" id="guestBtn" type="button" data-i18n="web.login.guest">Continue without an account</button>
  </div>
</main>
<script type="module" src="/web/login.js"></script>
</body>
</html>
